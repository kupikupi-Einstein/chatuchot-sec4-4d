#right{position:fixed;right:12px;top:78px;width:300px;max-height:calc(100% - 200px);overflow:auto;padding:12px;z-index:4}

.mut{color:var(--mut)} .acc{color:var(--acc)}

.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px}
.kpi b{display:block;font-size:18px}
.kpi span{font-size:11px;color:var(--mut)}

.gb .pg{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:3px}
#gnow{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);pointer-events:none}

#props{position:fixed;right:324px;top:78px;width:300px;padding:12px;z-index:6;display:none}

#hud .tr{position:absolute;right:3%;top:12vh;font-size:13px;line-height:1.6;text-align:right}
#hud .bl{position:absolute;left:3%;bottom:12vh;font-size:13px}
#hud .cross{position:absolute;left:50%;top:50%;width:140px;height:90px;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.5);border-radius:4px}
#hud .cross:before,#hud .cross:after{content:"";position:absolute;background:rgba(255,255,255,.7)}
#hud .cross:before{left:50%;top:30%;bottom:30%;width:1px}
#hud .cross:after{top:50%;left:40%;right:40%;height:1px}
#hud .rec{color:#ff4d4d}
#caption{position:fixed;left:50%;bottom:14vh;transform:translateX(-50%);z-index:6;font-size:22px;font-weight:600;padding:10px 22px;display:none;text-align:center;max-width:86vw}
#caption small{display:block;font-size:13px;font-weight:400;color:var(--mut)}
#loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#0b1220;color:#e9eef5;transition:opacity .6s}
#loading .sp{width:44px;height:44px;border:3px solid rgba(255,255,255,.15);border-top-color:#f0b429;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#flyhelp{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:6;padding:6px 14px;display:none;font-size:12px}

.pclose{position:absolute;top:6px;right:6px;z-index:2;padding:1px 7px;font-size:11px;line-height:1.4;border-radius:7px;opacity:.75}

#modalBack{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:29;display:none}

#drop.over{border-color:var(--acc);color:var(--txt)}
#impStatus{font-size:12px;line-height:1.55;margin:8px 0;white-space:pre-wrap}

.mrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:10px}
#schedSrc{font-size:11px;color:var(--mut);margin-top:2px}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;border:1px solid var(--line)}
.pill.wip{background:var(--wip);color:#111}.pill.done{background:var(--ok);color:#111}.pill.plan{background:#7c8aa0;color:#111}

function axisAt(sta, off = 0) {                                        // point on the construction CL at a station, off = right (+) / left (−) looking NE (towards Saraburi)
  let i = 0; while (i < AX.length - 2 && AX[i + 1][0] < sta) i++;

  return { x: a[1] + (b[1] - a[1]) * t - dz * off, z: a[2] + (b[2] - a[2]) * t + dx * off, a: Math.atan2(dz, dx), dx, dz };
